server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API and the live provisioning log (Server-Sent Events must not be buffered).
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 330s;
    client_max_body_size 2m;
  }

  # Single-page app: unknown paths fall back to index.html; the service worker and index are never cached.
  location = /index.html { add_header Cache-Control "no-store"; }
  location = /sw.js { add_header Cache-Control "no-store"; }
  location / { try_files $uri /index.html; }
}
