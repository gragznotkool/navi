# One command demo stack:  docker compose up --build   then open http://localhost:8080
# Demo credentials are the seeded development accounts (see userconfig.md). Not for production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: opshub_admin
      POSTGRES_PASSWORD: change-me-admin
      POSTGRES_DB: opshub
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432" # 5433 on the host so it never clashes with a local PostgreSQL on 5432
    volumes:
      - opshub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opshub_admin -d opshub"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: "4000"
      WEB_ORIGIN: http://localhost:8080
      DATABASE_ADMIN_URL: postgres://opshub_admin:change-me-admin@postgres:5432/opshub
      DATABASE_URL: postgres://opshub_app:change-me-app@postgres:5432/opshub
      JWT_SECRET: compose-demo-secret-compose-demo-secret-0123456789
      # Optional AI key for Bolo & Build; without it the built-in demo phrases answer.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  opshub_pg:
